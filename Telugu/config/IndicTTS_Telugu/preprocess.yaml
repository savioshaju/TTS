dataset: IndicTTS_Telugu
path:
  corpus_path: datasets/prepared/telugu_prepared_v2
  raw_path: preprocessing/Telugu/wavs_16k
  preprocessed_path: preprocessing/Telugu
preprocessing:
  val_size: 445
  text:
    text_cleaners:
    - basic_cleaners
    language: te
  audio:
    sampling_rate: 16000
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: phoneme_level
    normalization: true
  energy:
    feature: phoneme_level
    normalization: true

